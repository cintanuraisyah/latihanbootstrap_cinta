<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"
</head>
<body>
  <div class="container">
    </div>

   <!-- Navbar Bootstrap -->
    <nav class="navbar navbar-expand-lg navbar-light bg-blue shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#home">
                Cinta CV
            </a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active text-dark" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="#menu">Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="#kontak">Kontak</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
  <div id="carouselExampleRide" class="carousel slide mb-4"
     data-bs-ride="carousel" data-bs-interval="3000">

    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="cinta1.jpeg" class="d-block mx-auto"
                 style="width:50%; height:350px; object-fit:cover;"
                 alt="Foto 1">
        </div>

        <div class="carousel-item">
            <img src="cinta2.jpeg" class="d-block mx-auto"
                 style="width:50%; height:350px; object-fit:cover;"
                 alt="Foto 2">
        </div>

        <div class="carousel-item">
            <img src="cinta3.jpeg" class="d-block mx-auto"
                 style="width:50%; height:350px; object-fit:cover;"
                 alt="Foto 3">
        </div>
    </div>

    <div class="carousel-indicators position-static mt-3">
        <button type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide-to="0" class="active bg-dark"
                aria-label="Foto 1" aria-current="true"></button>
        <button type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide-to="1" class="bg-dark"
                aria-label="Foto 2"></button>
        <button type="button" data-bs-target="#carouselExampleRide"
                data-bs-slide-to="2" class="bg-dark"
                aria-label="Foto 3"></button>
    </div>

    <button class="carousel-control-prev" type="button"
            data-bs-target="#carouselExampleRide" data-bs-slide="prev">
        <span class="carousel-control-prev-icon bg-dark rounded"></span>
        <span class="visually-hidden">Sebelumnya</span>
    </button>

    <button class="carousel-control-next" type="button"
            data-bs-target="#carouselExampleRide" data-bs-slide="next">
        <span class="carousel-control-next-icon bg-dark rounded"></span>
        <span class="visually-hidden">Selanjutnya</span>
  </button>
</div>


  <h1>Hello World</h1>

</body>
</html>
